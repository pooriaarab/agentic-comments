name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: dev smoke
        run: node scripts/dev-smoke.mjs 8794 /health
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          WRANGLER_SEND_METRICS: "false"

  lower-bounds:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm pkg set devDependencies.agentic-identity=0.9.0 devDependencies.agentic-design=0.8.0
      - run: npm install --no-save agentic-identity@0.9.0 agentic-design@0.8.0
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm ls agentic-identity@0.9.0 agentic-design@0.8.0 react react-dom
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
